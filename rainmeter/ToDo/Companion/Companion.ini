[Rainmeter]
; The skin only reacts to clicks and todo.exe; the mascot places it beside herself when she opens it.
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!CommandMeasure MeasureCompanion "Start()"]

[Metadata]
Name=ToDo Companion
Information=A speech bubble next to the mascot for short conversations and lookups (todo.exe companion). It can read tasks, plans, and notes and search the web, but it cannot change anything. Opened and placed beside the mascot from her context menu (ToggleCompanion() in mascot_view.lua).

@Include1=#@#paths.inc
@Include2=#@#ui_state.inc
@Include3=#@#style-#Style#.inc

[Variables]
BubbleW=300
; Height of the conversation area at most; older turns scroll.
MaxTextH=300

; ---------------------------------------------------------------- measures

[MeasureCompanion]
Measure=Script
ScriptFile=#@#Scripts\companion_view.lua

[MeasureCompanionRun]
Measure=Plugin
Plugin=RunCommand
Program="#TodoExe#"
Parameter=
OutputType=UTF8
State=Hide
Timeout=240000
DynamicVariables=1
FinishAction=[!CommandMeasure MeasureCompanion "OnRunFinished()"]

[MeasureCompanionPrompt]
Measure=Plugin
Plugin=RunCommand
Program="#TodoExe#"
Parameter=
OutputType=UTF8
State=Hide
Timeout=-1
DynamicVariables=1
FinishAction=[!CommandMeasure MeasureCompanion "OnPromptFinished()"]
; Docked below the bubble; it closes by itself when the bubble does.

; ---------------------------------------------------------------- meter styles

[StyleText]
FontFace=#FontFace#
FontSize=#Body#
FontColor=#ColorText#
AntiAlias=1
SolidColor=0,0,0,1
ClipString=1

[StyleDim]
FontFace=#FontFace#
FontSize=#Meta#
FontColor=#ColorDim#
AntiAlias=1
SolidColor=0,0,0,1
ClipString=1

; ---------------------------------------------------------------- meters (companion_view.lua places them)

[Bubble]
Meter=Shape
Shape=Rectangle 0.5,0.5,(#BubbleW#-1),100,#Radius# | Fill Color #ColorBg# | StrokeWidth 1 | Stroke Color #ColorStroke#

[Title]
Meter=String
MeterStyle=StyleText
X=#PadX#
Y=#PadY#
FontWeight=600
Text=Chat

[ButtonClose]
Meter=String
MeterStyle=StyleDim
X=(#BubbleW#-#PadX#)
Y=#PadY#
StringAlign=Right
Text=close
MouseOverAction=[!SetOption ButtonClose FontColor #ColorAccent#][!UpdateMeter ButtonClose][!Redraw]
MouseLeaveAction=[!SetOption ButtonClose FontColor #ColorDim#][!UpdateMeter ButtonClose][!Redraw]
LeftMouseUpAction=[!DeactivateConfig]

[ButtonAsk]
Meter=String
MeterStyle=StyleDim
X=(#BubbleW#-#PadX#-96)
Y=#PadY#
StringAlign=Right
Text=ask
Hidden=1
MouseOverAction=[!SetOption ButtonAsk FontColor #ColorAccent#][!UpdateMeter ButtonAsk][!Redraw]
MouseLeaveAction=[!SetOption ButtonAsk FontColor #ColorDim#][!UpdateMeter ButtonAsk][!Redraw]
LeftMouseUpAction=[!CommandMeasure MeasureCompanion "OpenInput()"]

[ButtonNew]
Meter=String
MeterStyle=StyleDim
X=(#BubbleW#-#PadX#-52)
Y=#PadY#
StringAlign=Right
Text=new
MouseOverAction=[!SetOption ButtonNew FontColor #ColorAccent#][!UpdateMeter ButtonNew][!Redraw]
MouseLeaveAction=[!SetOption ButtonNew FontColor #ColorDim#][!UpdateMeter ButtonNew][!Redraw]
LeftMouseUpAction=[!CommandMeasure MeasureCompanion "NewChat()"]

[Viewport]
Meter=Shape
X=#PadX#
Y=(#PadY#+#HeaderH#)
Shape=Rectangle 0,0,(#BubbleW#-2*#PadX#),10 | Fill Color 255,255,255,255 | StrokeWidth 0
MouseScrollUpAction=[!CommandMeasure MeasureCompanion "Scroll(-1)"]
MouseScrollDownAction=[!CommandMeasure MeasureCompanion "Scroll(1)"]

[Conversation]
Meter=String
Container=Viewport
MeterStyle=StyleText
X=0
Y=0
W=(#BubbleW#-2*#PadX#)
ClipString=2
InlinePattern=(?m)^> .*$
InlineSetting=Color | #ColorAccent#
InlinePattern2=(?m)^    .*$
InlineSetting2=Color | #ColorDim#
InlinePattern3=(?m)^    .*$
InlineSetting3=Size | #Meta#

; Scrollbar thumb; companion_view.lua sizes and shows it when older lines are hidden.
[ScrollThumb]
Meter=Shape
Shape=Rectangle 0,0,3,16,1.5 | Fill Color #ColorDim# | StrokeWidth 0
Hidden=1

[Status]
Meter=String
MeterStyle=StyleDim
X=#PadX#
W=(#BubbleW#-2*#PadX#)
Text=

