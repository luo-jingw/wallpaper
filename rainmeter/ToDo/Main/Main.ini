[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!CommandMeasure MeasureChat "Start()"][!CommandMeasure MeasureTasks "Start()"]

[Metadata]
Name=ToDo
Information=Tasks, plans, and DeepSeek conversations backed by todo.exe. All content changes go through todo.exe.

; ui_state.inc defines Style (a | b | c) before the style file is chosen.
@Include1=#@#paths.inc
@Include2=#@#ui_state.inc
@Include3=#@#style-#Style#.inc

[Variables]
SegX=(#SkinWidth#-#PadX#-96)
HeaderMid=(#PadY#+#HeaderH#/2)
BarY=(#PadY#+#HeaderH#+4)

; ---------------------------------------------------------------- meter styles

[StyleText]
FontFace=#FontFace#
FontSize=#Body#
FontColor=#ColorText#
AntiAlias=1
SolidColor=0,0,0,1
ClipString=1

[StyleDim]
FontFace=#FontFace#
FontSize=#Meta#
FontColor=#ColorDim#
AntiAlias=1
SolidColor=0,0,0,1
ClipString=1

[StyleChip]
FontFace=#FontFace#
FontSize=#Meta#
FontColor=#ColorDim#
AntiAlias=1
SolidColor=#ColorPanel#
Padding=6,1,6,2
StringAlign=LeftCenter

[StyleSeg]
FontFace=#FontFace#
FontSize=#Meta#
FontColor=#ColorDim#
AntiAlias=1
SolidColor=0,0,0,1
StringAlign=CenterCenter
Y=#HeaderMid#
H=18

[StyleRowText]
FontFace=#FontFace#
FontSize=#Body#
FontColor=#ColorText#
AntiAlias=1
SolidColor=0,0,0,1
ClipString=1
StringAlign=LeftCenter
Hidden=1

[StyleRowMeta]
FontFace=#FontFace#
FontSize=#Meta#
FontColor=#ColorDim#
AntiAlias=1
SolidColor=0,0,0,1
ClipString=1
StringAlign=RightCenter
X=(#SkinWidth#-#PadX#-4)
Hidden=1

[StyleRowShape]
Shape=Rectangle 0,0,0,0 | StrokeWidth 0 | Fill Color 0,0,0,0
Shape2=Rectangle 0,0,0,0 | StrokeWidth 0 | Fill Color 0,0,0,0
Shape3=Rectangle 0,0,0,0 | StrokeWidth 0 | Fill Color 0,0,0,0
Shape4=Rectangle 0,0,0,0 | StrokeWidth 0 | Fill Color 0,0,0,0
Hidden=1

; ---------------------------------------------------------------- measures

[MeasureTasks]
Measure=Script
ScriptFile=#@#Scripts\task_view.lua
RowCount=10
UiStateFile=#@#ui_state.inc

[MeasurePlan]
Measure=Script
ScriptFile=#@#Scripts\plan_view.lua
BlockRows=12
ChangeRows=8
UnplannedRows=6

[MeasureChat]
Measure=Script
ScriptFile=#@#Scripts\chat_view.lua
ListRows=8
UiStateFile=#@#ui_state.inc
MaxChatHeight=240

[MeasureTaskList]
Measure=Plugin
Plugin=RunCommand
Program="#TodoExe#"
Parameter=
OutputType=UTF8
State=Hide
Timeout=30000
DynamicVariables=1
FinishAction=[!CommandMeasure MeasureTasks "OnListFinished()"]

[MeasureTaskAction]
Measure=Plugin
Plugin=RunCommand
Program="#TodoExe#"
Parameter=
OutputType=UTF8
State=Hide
Timeout=30000
DynamicVariables=1
FinishAction=[!CommandMeasure MeasureTasks "OnActionFinished()"]

[MeasureTaskPrompt]
Measure=Plugin
Plugin=RunCommand
Program="#TodoExe#"
Parameter=
OutputType=UTF8
State=Hide
Timeout=-1
DynamicVariables=1
FinishAction=[!CommandMeasure MeasureTasks "OnPromptFinished()"]

[MeasurePlanRun]
Measure=Plugin
Plugin=RunCommand
Program="#TodoExe#"
Parameter=
OutputType=UTF8
State=Hide
Timeout=240000
DynamicVariables=1
FinishAction=[!CommandMeasure MeasurePlan "OnRunFinished()"]

[MeasurePlanAction]
Measure=Plugin
Plugin=RunCommand
Program="#TodoExe#"
Parameter=
OutputType=UTF8
State=Hide
Timeout=30000
DynamicVariables=1
FinishAction=[!CommandMeasure MeasurePlan "OnActionFinished()"]

[MeasureChatRun]
Measure=Plugin
Plugin=RunCommand
Program="#TodoExe#"
Parameter=
OutputType=UTF8
State=Hide
Timeout=240000
DynamicVariables=1
FinishAction=[!CommandMeasure MeasureChat "OnChatFinished()"]

[MeasureChatList]
Measure=Plugin
Plugin=RunCommand
Program="#TodoExe#"
Parameter=
OutputType=UTF8
State=Hide
Timeout=30000
DynamicVariables=1
FinishAction=[!CommandMeasure MeasureChat "OnListFinished()"]

[MeasureSkillList]
Measure=Plugin
Plugin=RunCommand
Program="#TodoExe#"
Parameter=
OutputType=UTF8
State=Hide
Timeout=30000
DynamicVariables=1
FinishAction=[!CommandMeasure MeasureChat "OnSkillsFinished()"]

[MeasureChatPrompt]
Measure=Plugin
Plugin=RunCommand
Program="#TodoExe#"
Parameter=
OutputType=UTF8
State=Hide
Timeout=-1
DynamicVariables=1
FinishAction=[!CommandMeasure MeasureChat "OnPromptFinished()"]

[MeasureTick]
Measure=Calc
Formula=(MeasureTick + 1) % 60
IfCondition=MeasureTick = 0
IfTrueAction=[!CommandMeasure MeasureTasks "Tick()"]

; ---------------------------------------------------------------- background (chat_view.lua sets its height)

[MeterBackground]
Meter=Shape
Shape=Rectangle 0.5,0.5,(#SkinWidth#-1),120,#Radius# | Fill Color #ColorBg# | Stroke Color #ColorStroke# | StrokeWidth 1

