[Rainmeter]
; One animation frame per update.
Update=#MascotFrameMs#
; Meters never update on their own: updating all 1700 frame meters in every frame costs about 10% of a
; CPU core. mascot_view.lua shows, hides, and moves them with bangs that take effect at once, and updates a
; meter explicitly after !SetOption. The measures below update in every frame.
DefaultUpdateDivider=-1
AccurateText=1
OnRefreshAction=[!CommandMeasure MeasureDesktop "Watch #SKINSPATH#ToDo\Main\Main.ini"][!CommandMeasure MeasureCompanionWindow "Watch #SKINSPATH#ToDo\Companion\Companion.ini"][!CommandMeasure MeasureMascot "Start()"]
ContextTitle=Show / hide the ToDo window
ContextAction=[!CommandMeasure MeasureMascot "ToggleTodo()"]
ContextTitle2=Always on top: on
ContextAction2=[!ZPos 2]
ContextTitle3=Always on top: off
ContextAction3=[!ZPos 0]
ContextTitle4=Chat bubble: show / hide
ContextAction4=[!CommandMeasure MeasureMascot "ToggleCompanion()"]

[Metadata]
Name=ToDo Mascot
Information=Layered whale-maid mascot. Click the head to pat her, the body to feed her; double-click to show or hide the ToDo window; click her tail or a fin to open or close the chat bubble. Main makes her eat after an answer and write while a plan is made.

[Variables]
; Milliseconds per animation frame. Windows timers tick every 15.6 ms, so 15 gives about 64 frames per
; second (20 would wait two ticks); mascot_view.lua advances by the real elapsed time from MeasureCursor.
MascotFrameMs=15

@Include1=#@#Mascot\layout.inc

; Cursor position "X,Y" for the eyes (plugins/cursor_pos, installed by scripts/install_skin.ps1).
; Updated before MeasureMascot in every frame.
[MeasureCursor]
Measure=Plugin
Plugin=CursorPos
UpdateDivider=1

; "VISIBLE,LEFT,TOP,RIGHT,BOTTOM,IDLE_MS,FULLSCREEN": the ToDo window (a skin window's title is its .ini path),
; the time since the last input, and whether a full-screen app is in front (plugins/desktop_state). She sleeps
; on it and looks at the ToDo window.
[MeasureDesktop]
Measure=Plugin
Plugin=DesktopState
UpdateDivider=1

; The chat bubble's window (ToDo\Companion): whether it is open. ToggleCompanion() updates it before reading.
[MeasureCompanionWindow]
Measure=Plugin
Plugin=DesktopState
UpdateDivider=-1

[MeasureMascot]
Measure=Script
ScriptFile=#@#Scripts\mascot_view.lua
UpdateDivider=1

; ---------------------------------------------------------------- window (transparent; fixes the size)

[Canvas]
Meter=Shape
Shape=Rectangle 0,0,#MascotWindowW#,#MascotWindowH# | Fill Color 0,0,0,0 | StrokeWidth 0

; ---------------------------------------------------------------- frames, bottom to top
; Hair<angle>, Tail<angle>, FinL<angle>, FinR<angle>, Ahoge<angle>, Lower<pose>, Upper<pose><lean>, Head<head>, Sclera<head>,
; IrisClip<head> (container) with Iris<head>, Lashes<head>, <patch><head>, Arms<pose><lean>
; (design/mascot/export_skin_assets.py). One frame of each part is shown at a time.

[Frames]
@Include=#@#Mascot\frames.inc

; ---------------------------------------------------------------- click areas (alpha 1: invisible but clickable)

; The tail and the fins open or close the chat bubble. They lie under the body and head areas, which keep
; the few pixels where they overlap.
[HitTail]
Meter=Shape
Shape=Ellipse #TailHitCX#,#TailHitCY#,#TailHitRX#,#TailHitRY# | Fill Color 0,0,0,1 | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureMascot "ClickTail()"]

[HitFinL]
Meter=Shape
Shape=Ellipse #FinLHitCX#,#FinLHitCY#,#FinLHitRX#,#FinLHitRY# | Fill Color 0,0,0,1 | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureMascot "ClickFin('finl')"]

[HitFinR]
Meter=Shape
Shape=Ellipse #FinRHitCX#,#FinRHitCY#,#FinRHitRX#,#FinRHitRY# | Fill Color 0,0,0,1 | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureMascot "ClickFin('finr')"]

[HitBody]
Meter=Shape
Shape=Rectangle #BodyHitX#,#BodyHitY#,#BodyHitW#,#BodyHitH# | Fill Color 0,0,0,1 | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureMascot "ClickBody()"]
LeftMouseDoubleClickAction=[!CommandMeasure MeasureMascot "ToggleTodo()"]

[HitHead]
Meter=Shape
Shape=Ellipse #HeadHitCX#,#HeadHitCY#,#HeadHitRX#,#HeadHitRY# | Fill Color 0,0,0,1 | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureMascot "ClickHead()"]
LeftMouseDoubleClickAction=[!CommandMeasure MeasureMascot "ToggleTodo()"]

